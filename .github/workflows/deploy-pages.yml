# Build the game and publish it to GitHub Pages.
#
# Runs on every push to main (and by hand from the Actions tab).
# The site: https://peterukor.github.io/NYC-life/
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests first: a broken build never goes live.
      - run: npm test
      # 🌐 Online play: set a repository variable API_URL (Settings → Secrets and
      # variables → Actions → Variables) to the server's address. Unset = offline game.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
